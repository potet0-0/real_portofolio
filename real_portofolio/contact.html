    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />
</head>

<body class="contact">

<nav>
    <span class="nav-logo">Isaac</span>

    <div class="nav-links">
        <div class="nav-slider"></div>

        <ul>
            <li><a href="index.html">Home</a></li>

<div class="content">
    <section class="contact-main">

        <div class="contact-text">
            <h1>Contact Me</h1>
            <p>Have a project in mind or just want to say hi? Fill out the form and I'll get back to you.</p>
        </div>

        <div class="contact-form-card">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Your name" />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="your@email.com" />
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="What's on your mind?"></textarea>
            </div>

            <button class="btn contact-btn" onclick="handleSubmit()">Send Message</button>
            <p class="form-feedback" id="formFeedback"></p>
        </div>

    </section>

    <section class="contact-links">
        <a href="mailto:islea008@osloskolen.no" class="contact-chip">Email</a>
        <a href="https://github.com/potet0-0" target="_blank" class="contact-chip">GitHub</a>
        <a href="https://linkedin.com/in/yourhandle" target="_blank" class="contact-chip">LinkedIn</a>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
